name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without the v prefix (for example 0.2.3)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: macos-15
    env:
      VERSION: dev-${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate iteration version
        run: |
          branch_version="${VERSION#dev-}"
          if [[ ! "$branch_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $branch_version" >&2
            exit 1
          fi
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Configuration/DevBar-Info.plist)
          test "$branch_version" = "$app_version"
      - name: Build ad-hoc signed package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          ./Scripts/ci-release.sh
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${VERSION#dev-}"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} already exists. Publish a new version instead of replacing released assets." >&2
            exit 1
          fi
          release_sha=$(git rev-parse HEAD)
          gh release create "v${version}" dist/*.dmg dist/*.sha256 \
            --target "$release_sha" \
            --title "v${version}" \
            --generate-notes
      - name: Create appcast pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${VERSION#dev-}"
          branch="release/appcast-v${version}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add appcast.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish appcast for v${version}"
            git push origin "HEAD:refs/heads/${branch}"
            if [[ "$(gh pr list --base main --head "${branch}" --state open --json number --jq 'length')" == "0" ]]; then
              gh pr create \
                --base main \
                --head "${branch}" \
                --title "chore: publish appcast for v${version}" \
                --body "Publishes the Sparkle appcast entry generated from the uploaded v${version} release assets."
            fi
          fi
